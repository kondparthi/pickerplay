<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Truth or Dare">
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="32" fill="#1e88e5"/>
    <rect y="32" width="64" height="32" fill="#e53935"/>
  </g>
  <text x="32" y="22" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#fff" letter-spacing="-.3">TRUTH</text>
  <text x="32" y="56" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#fff" letter-spacing="-.3">DARE</text>
  <circle cx="32" cy="32" r="9" fill="#111" stroke="#fff" stroke-width="2"/>
  <text x="32" y="35.6" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="9.5" fill="#fff">OR</text>
</svg>
